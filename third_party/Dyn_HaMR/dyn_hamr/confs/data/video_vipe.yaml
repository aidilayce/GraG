type: folder #video
split: custom
seq: dog_toy
root: ${oc.env:GRAG_WORK_DIR}/${data.seq}
video_dir: demo
ext: mp4
src_path: ${data.root}/${data.video_dir}/${data.seq}.${data.ext}
frame_opts:
  ext: jpg
  fps: 10 #25
  start_sec: 0
  end_sec: -1
use_cams: True
track_ids: "all"
shot_idx: 0
start_idx: 0
end_idx: -1
split_cameras: True
name: ${data.seq}-${data.track_ids}-shot-${data.shot_idx}-${data.start_idx}-${data.end_idx}
sources:
  images: ${data.root}/rgb
  cameras: ${data.root}/dynhamr/cameras/${data.seq}/shot-${data.shot_idx}
  tracks: ${data.root}/dynhamr/track_preds/${data.seq}
  shots: ${data.root}/dynhamr/shot_idcs/${data.seq}.json

# DA3-specific options
use_da3: True
da3_path: ${oc.env:GRAG_WORK_DIR}/${data.seq}/da3_pointmaps_intrinsics_extrinsics.pt
